<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leave a Review | Corcoran Construction</title>
<meta name="description" content="Tell us how Corcoran Construction did. Rate your experience and leave a quick review.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
</head>
<body>

<nav class="nav scrolled">
  <a href="index.html" class="brand"><img class="brand-logo" src="img/corcoran-logo-nav.png" width="1200" height="254" alt="Corcoran Construction Ltd"></a>
  <div class="nav-links">
    <a href="index.html#services">Services</a>
    <a href="index.html#about">About</a>
    <a href="index.html#contact">Contact</a>
    <a href="tel:+64272230890" class="btn btn-primary">027 223 0890</a>
  </div>
  <button class="nav-toggle" aria-label="Menu">☰</button>
</nav>

<div class="review-wrap">
  <div class="review-card">
    <span class="eyebrow">Your feedback</span>
    <h1>How did we do?</h1>
    <p>Tap a star to rate your experience with Corcoran Construction.</p>
    <div class="star-pick" id="stars">
      <button data-rating="5" aria-label="5 stars">★</button>
      <button data-rating="4" aria-label="4 stars">★</button>
      <button data-rating="3" aria-label="3 stars">★</button>
      <button data-rating="2" aria-label="2 stars">★</button>
      <button data-rating="1" aria-label="1 star">★</button>
    </div>
    <p class="review-hint">5 = couldn't be happier · 1 = we let you down</p>
    <a href="index.html" class="back-link">← Back to site</a>
  </div>
</div>

<script>
  // 4-5 stars -> Google review; 1-3 stars -> private feedback form
  var GOOGLE_REVIEW_URL = "https://g.page/r/PLACEHOLDER/review";
  document.querySelectorAll('#stars button').forEach(function(btn){
    btn.addEventListener('click', function(){
      var r = parseInt(this.getAttribute('data-rating'), 10);
      if (r >= 4) { window.location.href = GOOGLE_REVIEW_URL; }
      else { window.location.href = 'private.html?rating=' + r; }
    });
  });
</script>
<script src="main.js"></script>
</body>
</html>
